<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Sharad Tiwari for AI consulting, product strategy, and machine learning engineering." />
    <title>Contact — Sharad Tiwari AI Consulting</title>
    <link rel="canonical" href="https://sharad-tiwari.ai/contact.html" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/typography.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="theme-dark" data-page="contact">
    <div id="app-shell">
      <header id="navbar-root"></header>
      <main id="main-content" class="page-shell" aria-label="Primary content">
        <section class="page-intro container reveal-on-scroll">
          <h1>Contact</h1>
          <p>Page foundation for secure, accessible inquiry and next-step engagement.</p>
        </section>

        <section class="container">
          <div class="form-card">
            <form data-contact-form>
              <div class="form-group">
                <label for="contact-name">Name</label>
                <input id="contact-name" name="name" class="form-input" type="text" placeholder="Your name" required />
              </div>
              <div class="form-group">
                <label for="contact-email">Email</label>
                <input id="contact-email" name="email" class="form-input" type="email" placeholder="you@example.com" required />
              </div>
              <div class="form-group">
                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="message" class="form-textarea" rows="6" placeholder="Tell me about your AI initiative" required></textarea>
              </div>
              <div class="flex gap-m align-end">
                <button class="btn btn-primary" type="submit">Send message</button>
                <p data-form-status class="small-copy"></p>
              </div>
            </form>
          </div>
        </section>
      </main>
      <footer id="footer-root"></footer>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
