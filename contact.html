<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Sharad Tiwari for AI consulting, product strategy, and machine learning engineering." />
    <title>Contact — Sharad Tiwari AI Consulting</title>
    <link rel="canonical" href="https://sharadktiwari.github.io/contact.html" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/typography.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="theme-dark" data-page="contact">
    <div id="app-shell">
      <header id="navbar-root"></header>
      <main id="main-content" class="page-shell" aria-label="Primary content">
        <section class="page-intro container reveal-on-scroll" data-json="contactHero"></section>

        <section class="container section-gap">
          <div class="contact-layout">
            <div class="contact-main">
              <div class="form-card">
                <form data-contact-form id="contact-form">
                  <div class="form-group">
                    <label for="contact-name">Name</label>
                    <input id="contact-name" name="name" class="form-input" type="text" placeholder="Your full name" required />
                  </div>

                  <div class="form-grid">
                    <div class="form-group">
                      <label for="contact-email">Email</label>
                      <input id="contact-email" name="email" class="form-input" type="email" placeholder="you@example.com" required />
                    </div>
                    <div class="form-group">
                      <label for="contact-industry">Industry</label>
                      <select id="contact-industry" name="industry" class="form-input" required>
                        <option value="">Select an industry</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label for="contact-project-type">Project type</label>
                      <select id="contact-project-type" name="projectType" class="form-input" required>
                        <option value="">Select a project type</option>
                      </select>
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="contact-message">Project overview</label>
                    <textarea id="contact-message" name="message" class="form-textarea" rows="6" placeholder="Describe the challenge, desired outcomes, and current stage." required></textarea>
                  </div>

                  <div class="form-grid">
                    <div class="form-group">
                      <label for="contact-timeline">Preferred timeline</label>
                      <input id="contact-timeline" name="timeline" class="form-input" type="text" placeholder="e.g. 1-3 months" />
                    </div>
                    <div class="form-group">
                      <label for="contact-budget">Budget range</label>
                      <input id="contact-budget" name="budget" class="form-input" type="text" placeholder="e.g. $10k - $30k" />
                    </div>
                  </div>

                  <div class="flex gap-m align-end">
                    <button class="btn btn-primary" type="submit">Send message</button>
                    <p data-form-status class="small-copy form-status" aria-live="polite"></p>
                  </div>
                </form>
              </div>
            </div>

            <aside class="contact-sidebar">
              <div class="card scale-up contact-summary-card" data-json="contactAvailability"></div>
            </aside>
          </div>
        </section>

        <section class="container section-gap" data-json="contactMethods"></section>
        <section class="container section-gap" data-json="contactProjectTypes"></section>
        <section class="container section-gap" data-json="contactIndustries"></section>
        <section class="container section-gap" data-json="contactFaq"></section>
        <section class="container section-gap" data-json="contactCta"></section>
      </main>
      <footer id="footer-root"></footer>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
